name: Uptime

# Checks the public deployment from outside Fly every 15 minutes. A failed run
# means the site, its HTTPS certificate or its database is down; GitHub emails
# the failure to whoever last changed this schedule. Does nothing until the
# repository variable PUBLIC_URL is set (Settings → Secrets and variables →
# Actions → Variables), e.g. https://redpen-demo.fly.dev
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: vars.PUBLIC_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Health endpoint (app and database)
        run: |
          # Three tries a minute apart, so one slow response is not an outage.
          for i in 1 2 3; do
            if curl -sf --max-time 20 "${{ vars.PUBLIC_URL }}/api/health" | grep -q '"ok"'; then echo "healthy"; exit 0; fi
            sleep 60
          done
          echo "::error::${{ vars.PUBLIC_URL }}/api/health has not answered ok for three minutes"
          exit 1
      - name: HTTPS and a public page
        run: |
          curl -sf --max-time 20 -o /dev/null "${{ vars.PUBLIC_URL }}/trust"
          curl -sfI --max-time 20 "${{ vars.PUBLIC_URL }}/login" | grep -qi "strict-transport-security"
