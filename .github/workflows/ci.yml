name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Start S3Mock (S3 API for the storage driver test)
        run: docker run -d --name s3mock -p 9090:9090 -e COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS=redpen-test adobe/s3mock:4.7.0
      - name: Create database roles and databases
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f db/bootstrap.sql
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests (Vitest)
        run: |
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:9090/ && break; sleep 1; done
          npm test
        env:
          S3_TEST_ENDPOINT: http://localhost:9090
      - name: Tenancy tests with row-level security bypassed (proves the data-access layer alone)
        run: |
          npx vitest run tests/integration/routes.test.ts
          npx vitest run tests/integration/marking.test.ts -t "DAL tenancy"
          npx vitest run tests/integration/marking-engine.test.ts -t "refused for colleagues|another school's work"
          npx vitest run tests/integration/photos.test.ts -t "is refused for colleagues|nobody else can"
        env:
          TEST_DATABASE_URL: postgres://redpen_owner:redpen_owner_dev@localhost:5432/redpen_test
      - name: Build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (Playwright)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Demo rehearsal (docs/demo-script.md on the full demo dataset)
        run: npm run test:demo
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-demo
          path: playwright-report-demo/
          retention-days: 7

  # The evaluation harness. Runs against the live AI when the prompt, the
  # marking engine or the eval cases change and the ANTHROPIC_API_KEY secret is
  # set; otherwise runs in demo mode (checks the harness only) with a warning.
  # Fails if agreement within one mark drops more than EVAL_MAX_DROP below eval/baseline.json.
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Decide whether to call the live AI
        id: scope
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then changed=yes
          elif git diff --name-only "$base" HEAD | grep -qE '^(src/server/marking/|eval/)'; then changed=yes
          else changed=no; fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Prompt, engine or eval cases changed: $changed"
      - name: Evaluation harness
        env:
          ANTHROPIC_API_KEY: ${{ steps.scope.outputs.changed == 'yes' && secrets.ANTHROPIC_API_KEY || '' }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          MODEL_PRICE_INPUT_PER_MTOK: ${{ vars.MODEL_PRICE_INPUT_PER_MTOK }}
          MODEL_PRICE_CACHE_READ_PER_MTOK: ${{ vars.MODEL_PRICE_CACHE_READ_PER_MTOK }}
          MODEL_PRICE_OUTPUT_PER_MTOK: ${{ vars.MODEL_PRICE_OUTPUT_PER_MTOK }}
          EVAL_MAX_DROP: "0.05"
        run: npm run eval -- --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval/reports/
          retention-days: 30

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Audit dependencies for known vulnerabilities
        run: npm audit --audit-level=high

  # The production image as a demo deployment runs it: migrates and seeds itself
  # on first start, serves pages, and its data survives a backup and restore.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      PGPASSWORD: postgres
      ADMIN_URL: postgres://redpen_owner:redpen_owner_dev@localhost:5432/redpen
      APP_URL: postgres://redpen_app:redpen_app_dev@localhost:5432/redpen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Build production image
        run: docker build -t redpen:ci .
      - name: Create database roles and databases
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f db/bootstrap.sql
      - name: Migrate the way Fly's release_command does
        run: docker run --rm --network host -e DATABASE_ADMIN_URL="$ADMIN_URL" redpen:ci node scripts/migrate.ts | tee /tmp/migrate.log && grep -q "migrations up to date" /tmp/migrate.log
      - name: Start the image as a demo deployment, with a root-owned volume as Fly mounts it
        run: |
          sudo mkdir -p /tmp/flyvol && sudo chown root:root /tmp/flyvol
          docker run -d --name app --network host -v /tmp/flyvol:/data \
            -e DATABASE_URL="$APP_URL" -e DATABASE_ADMIN_URL="$ADMIN_URL" \
            -e PUPIL_NAME_KEY="$(openssl rand -base64 32)" -e AUTH_SECRET="$(openssl rand -base64 32)" \
            -e FILE_URL_SECRET="$(openssl rand -base64 32)" -e AUTH_TRUST_HOST=true -e AUTH_URL=http://localhost:3000 \
            -e STORAGE_DRIVER=local -e STORAGE_LOCAL_DIR=/data/photos -e CLIENT_IP_HEADER=fly-client-ip \
            -e ALLOW_DEMO_SEED=true -e SEED_DEMO_IF_EMPTY=true -e MARKING_MODE=demo \
            redpen:ci
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/health && break; sleep 2; done
          curl -sf http://localhost:3000/api/health
          docker logs app 2>&1 | tail -20
      - name: The server runs as the app user, not root, and can write to the volume
        run: |
          test "$(docker exec app stat -c %u /proc/1)" != "0"
          test "$(stat -c %U /tmp/flyvol/photos)" != "root"
      - name: Pages are served, security headers are set, and the demo data is there
        run: |
          curl -sf http://localhost:3000/trust | grep -q "Trust centre"
          curl -sf -o /dev/null -w "%{http_code}\n" http://localhost:3000/login | grep -q 200
          curl -sI http://localhost:3000/login | grep -qi "strict-transport-security"
          test "$(psql "$ADMIN_URL" -tAc 'select count(*) from submission')" -gt 500
      - run: npm ci
      - name: Backup and tested restore
        run: |
          scripts/db-backup.sh /tmp/redpen.dump
          psql -h localhost -U postgres -c "create database redpen_restored owner redpen_owner"
          DATABASE_ADMIN_URL=postgres://redpen_owner:redpen_owner_dev@localhost:5432/redpen_restored scripts/db-restore.sh /tmp/redpen.dump
          RESTORED_ADMIN_URL=postgres://redpen_owner:redpen_owner_dev@localhost:5432/redpen_restored \
          RESTORED_APP_URL=postgres://redpen_app:redpen_app_dev@localhost:5432/redpen_restored \
            npx tsx scripts/verify-restore.ts
        env:
          DATABASE_ADMIN_URL: postgres://redpen_owner:redpen_owner_dev@localhost:5432/redpen
